<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>轮盘候选 B — 半环 Arc Menu（极轻量）</title>
<style>
:root{--ease-out:cubic-bezier(.16,1,.3,1);--ease-pop:cubic-bezier(.34,1.4,.44,1);}
body[data-theme="dark"]{
  --surface:rgba(24,24,27,.82); --solid:#18181b; --elevated:#27272a;
  --border:rgba(255,255,255,.10); --strong:#3f3f46;
  --text:#fafafa; --text2:#a1a1aa; --muted:#71717a; --accent:#3b82f6; --soft:rgba(59,130,246,.18);
  --panel:#101013; --bar:#1b1b1f;
}
body[data-theme="light"]{
  --surface:rgba(255,255,255,.9); --solid:#fff; --elevated:#f4f4f5;
  --border:rgba(0,0,0,.08); --strong:#d4d4d8;
  --text:#18181b; --text2:#52525b; --muted:#a1a1aa; --accent:#2563eb; --soft:rgba(37,99,235,.12);
  --panel:#fff; --bar:#f4f4f5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  height:100vh;overflow:hidden;color:var(--text);
  background:
    radial-gradient(1100px 650px at 70% 20%, #274b38 0%, transparent 55%),
    radial-gradient(800px 600px at 20% 80%, #43355c 0%, transparent 50%),
    linear-gradient(200deg,#0e1210,#12141c 60%,#0f1118);
}
body[data-theme="light"]{
  background:
    radial-gradient(1100px 650px at 70% 20%, #c2e2cd 0%, transparent 55%),
    radial-gradient(800px 600px at 20% 80%, #d9cdf0 0%, transparent 50%),
    linear-gradient(200deg,#ecf0ea,#e3e8f2 60%,#eaecf1);
}
.fakeapp{position:absolute;right:9%;top:16%;width:44%;height:52%;border-radius:12px;overflow:hidden;
  background:var(--panel);border:1px solid var(--border);box-shadow:0 24px 70px rgba(0,0,0,.45);display:flex;flex-direction:column}
.fakeapp .bar{height:34px;background:var(--bar);display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--border)}
.fakeapp .bar i{width:10px;height:10px;border-radius:50%;background:#ef4444}.fakeapp .bar i:nth-child(2){background:#f59e0b}.fakeapp .bar i:nth-child(3){background:#22c55e}
.fakeapp .bar span{margin-left:8px;font-size:11px;color:var(--text2)}
.fakeapp .doc{flex:1;padding:18px 20px;font-size:13px;color:var(--text2);line-height:1.9}
.caret{display:inline-block;width:2px;height:14px;background:var(--accent);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.injected{color:var(--accent);font-weight:600}
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px;align-items:center;
  background:var(--surface);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:12px;color:var(--text2)}
.hud .seg{display:flex;gap:2px;background:rgba(127,127,127,.12);border-radius:8px;padding:2px}
.hud .seg button{border:none;background:none;color:var(--text2);font-size:11px;padding:3px 10px;border-radius:6px;cursor:pointer}
.hud .seg button.on{background:var(--elevated);color:var(--text)}
/* ---- Arc menu：锚点在光标，扇形向右展开 ---- */
#arc{position:fixed;width:0;height:0;z-index:20;display:none}
#arc.show{display:block}
.dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px var(--soft);animation:dotIn .18s var(--ease-out)}
@keyframes dotIn{from{transform:scale(0)}}
.arcitem{
  position:absolute;left:0;top:0;height:36px;min-width:120px;padding:0 14px 0 10px;pointer-events:auto;
  border-radius:999px;background:var(--solid);border:1px solid var(--strong);
  display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--text);cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.30);white-space:nowrap;
  opacity:0;transform:translate(var(--sx),var(--sy)) scale(.4);
  animation:grow 200ms var(--ease-pop) forwards;
}
@keyframes grow{to{opacity:1;transform:translate(var(--x),var(--y)) scale(1)}}
.arcitem:hover{border-color:var(--accent);color:var(--accent)}
.arcitem .k{font-size:9px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-weight:400}
.arcitem.more{color:var(--text2);font-weight:400}
.backbone{position:absolute;left:0;top:0;pointer-events:none;opacity:.5}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:30}
.toast{background:var(--solid);border:1px solid var(--strong);border-radius:10px;padding:9px 16px;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:dotIn .18s;display:flex;gap:8px;align-items:center}
.toast .dot2{width:8px;height:8px;border-radius:50%;background:#22c55e}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-theme="dark">
<div class="hud">
  <span data-i18n="hint">点击任意处模拟热键 · 弧形向右展开 · 数字键/点击选中 · Esc/外点关闭</span>
  <div class="seg" id="themeSeg"><button data-t="light">☀</button><button data-t="dark" class="on">☾</button></div>
  <div class="seg" id="langSeg"><button data-l="zh" class="on">中</button><button data-l="en">EN</button></div>
</div>

<div class="fakeapp">
  <div class="bar"><i></i><i></i><i></i><span data-i18n="app">终端 — zsh</span></div>
  <div class="doc"><span data-i18n="doc">$ 准备写一封英文邮件给合作方确认排期。</span><span class="caret"></span><div id="injectEcho"></div></div>
</div>

<div id="arc"></div>
<div class="toasts" id="toasts"></div>

<script>
const D={
 zh:{hint:"点击任意处模拟热键 · 弧形向右展开 · 数字键/点击选中 · Esc/外点关闭",app:"终端 — zsh",
     doc:"$ 准备写一封英文邮件给合作方确认排期。",injected:"已注入",more:"更多…"},
 en:{hint:"Click anywhere = hotkey · Fan opens rightward · 1-5/click · Esc/outside closes",app:"Terminal — zsh",
     doc:"$ Drafting an English email to confirm the schedule.",injected:"Injected",more:"More…"}
};
let lang="zh",open=false,items=[],mouse={x:innerWidth/2,y:innerHeight/2};
const $=s=>document.querySelector(s);
const P=[
 {name:"英文邮件润色",en:"Email polish",txt:"Please polish this email to sound professional yet concise:\n\n"},
 {name:"代码审查",en:"Code review",txt:"请审查以下代码的潜在 bug、性能与可读性：\n\n"},
 {name:"中译英",en:"ZH→EN",txt:"Translate to natural, idiomatic English:\n\n"},
 {name:"会议纪要",en:"Meeting minutes",txt:"整理为决议/行动项/待定：\n\n"},
 {name:"解释代码",en:"Explain code",txt:"用通俗语言解释这段代码：\n\n"},
 {name:"周报生成",en:"Weekly report",txt:"生成结构化周报：\n\n"},
 {name:"Bug 定位",en:"Debug",txt:"给出最可能的 3 个原因及排查步骤：\n\n"},
];
addEventListener("mousemove",e=>mouse={x:e.clientX,y:e.clientY});
function applyLang(){document.querySelectorAll("[data-i18n]").forEach(el=>{el.dataset.zh??=el.innerHTML;el.innerHTML=lang==="zh"?el.dataset.zh:(D.en[el.dataset.i18n]??el.dataset.zh);});}
$("#langSeg").querySelectorAll("button").forEach(b=>b.onclick=e=>{e.stopPropagation();lang=b.dataset.l;
 $("#langSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));applyLang();if(open)show();});
$("#themeSeg").querySelectorAll("button").forEach(b=>b.onclick=e=>{e.stopPropagation();document.body.dataset.theme=b.dataset.t;
 $("#themeSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));});

function show(){
  hide(true);open=true;const arc=$("#arc");arc.className="show";arc.innerHTML='<div class="dot"></div>';
  // 向右展开 130° 扇形：-65°..+65°，避免屏幕右缘时向左展开
  const rightward = mouse.x < innerWidth-200;
  const r=78, n=Math.min(P.length,5);
  items=P.slice(0,n);
  items.forEach((p,i)=>{
    const t=i/(n-1||1);                    // 0..1
    const ang=(rightward? -60+120*t : 240-120*t)*Math.PI/180;
    const x=Math.cos(ang)*r, y=Math.sin(ang)*r;
    const el=document.createElement("button");el.className="arcitem";
    el.style.setProperty("--x",x+"px");el.style.setProperty("--y",(y-18)+"px");
    el.style.setProperty("--sx","0px");el.style.setProperty("--sy","-18px");
    el.style.animationDelay=(i*25)+"ms";
    el.innerHTML=`<span class="k">${i+1}</span>${lang==="zh"?p.name:p.en}`;
    el.onclick=e=>{e.stopPropagation();pick(p);};
    arc.appendChild(el);
  });
  if(P.length>n){
    const el=document.createElement("button");el.className="arcitem more";
    const ang=(rightward? 74:180)*Math.PI/180;
    el.style.setProperty("--x",Math.cos(ang)*r+"px");el.style.setProperty("--y",(Math.sin(ang)*r-18)+"px");
    el.style.setProperty("--sx","0px");el.style.setProperty("--sy","-18px");
    el.style.animationDelay=(n*25)+"ms";el.textContent=D[lang].more;
    arc.appendChild(el);
  }
  arc.style.left=mouse.x+"px";arc.style.top=mouse.y+"px";
}
function hide(instant){
  const arc=$("#arc");if(instant){arc.className="";return;}
  arc.querySelectorAll(".arcitem").forEach((el,i)=>{el.style.animation=`grow 140ms var(--ease-out) reverse forwards`;el.style.animationDelay=(i*15)+"ms";});
  setTimeout(()=>{arc.className="";arc.innerHTML="";},200);open=false;
}
function pick(p){
  hide();
  const t=document.createElement("div");t.className="toast";
  t.innerHTML=`<span class="dot2"></span>${D[lang].injected}: ${lang==="zh"?p.name:p.en}`;
  $("#toasts").appendChild(t);setTimeout(()=>t.remove(),2200);
  const e=document.createElement("div");e.className="injected";e.textContent=p.txt.trim();$("#injectEcho").appendChild(e);
}
document.addEventListener("click",e=>{if(!open)show();else if(!e.target.closest(".arcitem"))hide();});
document.addEventListener("keydown",e=>{
  if(!open)return;
  if(e.key==="Escape")return hide();
  const n=parseInt(e.key);if(n>=1&&n<=items.length)pick(items[n-1]);
});
applyLang();
</script>
</body>
</html>
