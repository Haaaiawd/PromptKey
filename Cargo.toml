[workspace]
members = [
    "service",
]
resolver = "2"

[profile.dev]
debug = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[package]
name = "promptkey"
version = "2.0.0"
edition = "2021"
default-run = "promptkey"

[[bin]]
name = "promptkey"
path = "src/main.rs"



[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

# Task8: winres is Windows-only (PE resource embedding)
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
service = { path = "./service" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
ureq = "2.10"
url = "2.5"

# Task8: Win32 bindings only build on Windows
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.0.0"
# Launch-at-login across all three OSes: XDG autostart file on Linux,
# SMAppService LaunchAgent on macOS, registry Run key on Windows.
tauri-plugin-autostart = "2.0.0"
sysinfo = "0.30.0"
rusqlite = { version = "0.32", features = ["bundled"] }

# macOS-only additions — kept off the Windows/Linux dependency trees.
# `macos-private-api` is required for WebviewWindowBuilder::transparent on
# macOS (the wheel overlay); it calls an undocumented WKWebView API, which
# is acceptable here because the app ships unsigned/un-notarized outside
# the App Store. `image-png` unlocks Image::from_bytes for the tray icon.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api", "image-png"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
