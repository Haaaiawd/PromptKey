name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo check / clippy / test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # service/ uses edition 2024 — needs a recent stable toolchain.
      - name: cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  frontend:
    name: frontend static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Syntax-check all JS files
        run: |
          set -e
          find src -name '*.js' -print0 | while IFS= read -r -d '' f; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Validate JSON configs
        run: |
          set -e
          for f in tauri.conf.json capabilities/*.json src/packs/*.json; do
            echo "validating $f"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
          done

      # Tauri 2 capabilities regression gate — 2.0.x shipped zero capability
      # files; every plugin:* IPC call (event.listen, window.hide, …) was
      # ACL-denied while all e2e mocked __TAURI__. Never again.
      - name: Verify Tauri capabilities cover both windows
        run: node scripts/check_capabilities.mjs

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Hotkey status visibility e2e
        run: python tests/e2e/hotkey_status_e2e.py

      - name: Hotkey recorder e2e
        run: python tests/e2e/hotkey_recorder_e2e.py

      # No __TAURI__ mock — the previous blind spot. Asserts the app fails
      # LOUDLY (persistent banner / wheel error card) instead of silently.
      - name: Missing-Tauri visibility e2e (no mock)
        run: python tests/e2e/no_tauri_e2e.py
