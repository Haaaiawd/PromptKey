[package]
name = "service"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
env_logger = "0.11"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# P2: X11 session — global-hotkey supports X11 only on Linux (documented as
# such in PLATFORMS.md); x11rb for foreground-window context; arboard clipboard;
# enigo (x11rb backend by default) for injection.
global-hotkey = "0.6"
arboard = "3.4"
enigo = { version = "0.6", default-features = false, features = ["x11rb", "serde"] }
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
# P3: global-hotkey (Carbon tap backend), arboard clipboard, enigo (CGEvent);
# objc + core-foundation for NSWorkspace context + AX FFI in macos_ax.rs.
global-hotkey = "0.6"
arboard = "3.4"
enigo = "0.6"
objc = "0.2"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Pipes",
] }